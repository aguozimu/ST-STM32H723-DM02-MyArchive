# DAPLink/CMSIS-DAP over SWD. The OpenOCD script search path is supplied by
# the VS Code task/launch configuration.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]

# 4 MHz is reliable across common DAPLink probes and SWD wiring. Increase this
# after confirming stable downloads if faster programming is required.
adapter speed 4000

# This board can be accessed without a dedicated hardware reset line.
reset_config none
